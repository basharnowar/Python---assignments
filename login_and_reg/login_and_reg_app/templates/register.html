<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="d-flex flex-column">
        <h1>Register </h1>
        <form action="/register/" method="post">
            {% csrf_token %}
            <label for="first_name">First name</label>
            <input class="d-flex flex-column" type="text" name="first_name" id="first_name" />

            <label for="last_name">Last name</label>
            <input class="d-flex flex-column" type="text" name="last_name" id="last_name" />

            <label for="email">Email</label>
            <input class="d-flex flex-column" type="text" name="email" id="email" />

            <label for="password">Password</label>
            <input class="d-flex flex-column" type="password" name="password" id="password" />

            <label for="confirm_pw">Confirm PW</label>
            <input class="d-flex flex-column" type="password" name="confirm_pw" id="confirm_pw" />

            <button type="submit">Register</button>
        </form>

        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif%}

    </div>


    <br>

    <h1>Login </h1>
    <form action="/login/" method="post">
        {% csrf_token %}
        <label for="email">Email</label>
        <input class="d-flex flex-column" type="text" name="email" id="email" />

        <label for="password">Password</label>
        <input class="d-flex flex-column" type="password" name="password" id="password" />

        <button type="submit">Log In</button>
    </form>
</body>

</html>
