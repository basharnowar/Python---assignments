<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dojos & Ninjas with Template</title>
</head>

<body>
    <h1>Add a Dojo</h1>
    <form action="add_dojo/" method="post">
        {% csrf_token %}
        <label>name</label>
        <input type="text" name="name">
        <label>city</label>
        <input type="text" name="city">
        <label>state</label>
        <input type="text" name="state">
        <button type="submit" value="Add">Add</button>
    </form>

    <h1>Add a Ninja</h1>
    <form action="add_ninja/" method="post">
        {% csrf_token %}
        <label>First name:</label>
        <input type="text" name="first_name">
        <label>Last name</label>
        <input type="text" name="last_name">
        <select name="dojo_id">
            {% for dojo in dojos%}
            <option value="{{dojo.id}}">{{dojo.name}}</option>
            {% endfor %}
        </select>
        <button type="submit" value="Add">Add</button>
    </form>

    <h1>All the Dojos</h1>
    {% for dojo in dojos %}
    <h3>Ninjas at the {{ dojo.name }} Dojo</h3>

    <form action="/delete/{{ dojo.id }}/" method="post">
        {% csrf_token %}
        <button type="submit">Delete Dojo</button>
    </form>

    <ul>
        {% for ninja in dojo.ninjas.all %}
        <li>{{ ninja.first_name }} {{ ninja.last_name }}</li>
        {% endfor %}
    </ul>
    {% endfor %}
</body>

</html>
