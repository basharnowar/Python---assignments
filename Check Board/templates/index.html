<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkerboard</title>
    <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
</head>

<body>
    <div class="board">
        {% for r in range(rows) %}
        <div class="row">
            {% for c in range(cols) %}
            <div class="square {{ 'dark' if (r + c) % 2 == 0 else 'light' }}"></div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</body>

</html>
