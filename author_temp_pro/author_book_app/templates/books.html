<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books/Authors With Template</title>
</head>

<body>
    <a href="/authors">Author!</a>
    <h1>Add a Book</h1>
    <form action="/emil" method="post">
        {% csrf_token %}
        <p>Title: <input type="text" name="title"></p>
        <p>Description: <textarea name="desc"></textarea></p>
        <button type="submit">Add</button>
    </form>


    <h2>All Books</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Action</th>
        </tr>
        {% for book in all_books %}
        <tr>
            <td>{{book.id}}</td>
            <td><a href="/books/{{ book.id }}">{{ book.title }}</a></td>
            <td><a href="/books/{{ book.id }}">View</a></td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
